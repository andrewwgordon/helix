[project]
name = "helix"
version = "0.1.0"
description = "Flask-AppBuilder based Product Lifecycle Management (PLM) system"
readme = "README.md"
# Flask-AppBuilder 5.2.x supports Python <= 3.13.
requires-python = ">=3.12,<3.14"
dependencies = [
    "flask-appbuilder>=5.2,<6",
    # sqlalchemy-utils (transitive via FAB) is incompatible with SQLAlchemy 2.1
    # (it uses the removed sqlalchemy.orm.attributes.ScalarAttributeImpl).
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

# This is an application, not a distributable package: do not try to build it.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
# Alembic autogenerates these; don't lint generated code.
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
